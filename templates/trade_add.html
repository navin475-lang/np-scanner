<!DOCTYPE html>
<html>

<head>

<title>Add Trade</title>

<style>

body{
    font-family:Arial;
    background:#111;
    color:white;
    padding:30px;
}

.box{
    width:1100px;
    max-width:95%;
    margin:auto;
    background:#1b1b1b;
    padding:30px;
    border-radius:16px;
}

.form-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:22px;
}

.field{

    display:flex;
    flex-direction:column;
}

.full-row{

    grid-column:
    1 / -1;
}

label{

    margin-bottom:6px;
    font-weight:600;
}

input,
select,
textarea{

    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    background:#f3f4f6;
    font-size:15px;
}

textarea{

    min-height:90px;
    resize:vertical;
}

.btn-row{

    display:flex;
    gap:12px;
}

button{

    background:#00b894;
    color:white;
    border:none;
    padding:14px;
    width:100%;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
}

.cancel-btn{

    background:#64748b;
    color:white;
    padding:14px;
    border-radius:8px;
    text-decoration:none;
    text-align:center;
    width:100%;
    font-weight:700;
}

</style>

</head>

<body>

<div class="box">

<h2>📊 Add My Trade</h2>

<form
method="POST"
action="/add-my-trade"
>

<div class="form-grid">

    <div class="field">

        <label>Portfolio</label>

        <select
        name="portfolio"
        required
        >
            <option>Main</option>
            <option>Swing</option>
            <option>Long Term</option>
            <option>Paper</option>
        </select>

    </div>

    <div class="field">

        <label>Trade Date</label>

        <input
        type="date"
        name="trade_date"
        required
        >

    </div>

    <div class="field">

        <label>Timeframe</label>

        <select
        name="timeframe"
        >
            <option>Swing</option>
            <option>Positional</option>
            <option>Weekly</option>
        </select>

    </div>

    <div class="field">

        <label>Strategy</label>

        <select
        name="strategy"
        >
            <option>Technofunda</option>
            <option>Technical</option>
            <option>Breakout</option>
        </select>

    </div>

    <div class="field">

        <label>Tranche</label>

        <select
        name="tranche"
        >
            <option value="1">
                1st
            </option>

            <option value="2">
                2nd
            </option>

            <option value="3">
                3rd
            </option>
        </select>

    </div>

    <div class="field">

        <label>Stock</label>

        <input
        type="text"
        name="stock"
        required
        >

    </div>

    <div class="field">

        <label>Entry Price</label>

        <input
        type="number"
        step="0.01"
        name="entry"
        required
        >

    </div>

    <div class="field">

        <label>Quantity</label>

        <input
        type="number"
        name="qty"
        required
        >

    </div>

    <div class="field">

        <label>Stoploss</label>

        <input
        type="number"
        step="0.01"
        name="stoploss"
        required
        >

    </div>

    <div class="field">

        <label>Target</label>

        <input
        type="number"
        step="0.01"
        name="target"
        required
        >

    </div>

    <div
    class="
    field
    full-row
    "
    >

        <label>Remarks</label>

        <textarea
        name="remarks"
        placeholder="Trade Notes / Reason"
        ></textarea>

    </div>

    <div
    class="
    full-row
    btn-row
    "
    >

        <button
        type="submit"
        >
            Save Trade
        </button>

        <a
        href="/my-trades"
        class="cancel-btn"
        >
            Cancel
        </a>

    </div>

</div>

</form>

</div>

</body>
</html>
